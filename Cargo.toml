[workspace]
members = ["plugins/*"]
exclude = [
  "plugins/accelerator-sources",
  "plugins/cloudflare-dns",
  "plugins/docker-app",
  "plugins/doh",
  "plugins/reverse-l4",
  "plugins/shadowsocks-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
