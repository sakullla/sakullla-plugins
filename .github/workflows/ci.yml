name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          target: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Verify generated files, licenses, and secrets
        run: go run ./cmd/nre-ci repository --root .
      - name: Test Go workspace
        run: go test ./...
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Verify clean-build reproducibility
        run: go run ./cmd/nre-ci reproducible --root . --output dist -- make artifacts
