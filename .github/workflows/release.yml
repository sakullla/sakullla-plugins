name: official-release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    environment: official-release
    env:
      GOTOOLCHAIN: local
      NRE_OFFICIAL_SIGNER: ${{ secrets.NRE_OFFICIAL_SIGNER }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          target: wasm32-unknown-unknown
      - name: Build and verify official candidate
        run: go run ./cmd/nre-ci release --verify-reproducible --signer env:NRE_OFFICIAL_SIGNER
      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: official-release-${{ github.sha }}
          path: |
            dist/release-candidate
            market.yaml
          if-no-files-found: error
          retention-days: 30
