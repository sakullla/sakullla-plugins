schema_version: 1
id: ip-policy
version: 0.1.0
name: IP Policy
description: Authenticated HTTP and L4 IPv4/IPv6 and Host-managed GeoIP policy
compatibility:
  host: ">=0.1.0"
  agent: ">=0.1.0"
runtime:
  kind: wasm-policy
  abi: nre:policy/v1
  host_scope: agent
  entry: artifacts/ip-policy.wasm
artifacts:
  - path: artifacts/ip-policy.wasm
    sha256: a7430da86ab5e145facbeeb5c2f2a08483632a3893cfd64549ad49867aac0c97
    size: 9341
    mode: wasm
extension_points:
  - http.request
  - l4.accept
permissions:
  - policy.read
  - event.emit
config_schema: config.schema.json
ui_schema: ui.schema.json
resource_budget:
  timeout_ms: 2
  memory_bytes: 16777216
  concurrency: 64
  input_bytes: 131072
  output_bytes: 4096
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: never
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: package.sig
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
metadata:
  capability.policy.trusted-source: unavailable
  geo_data_owner: host-mmdb-handle
