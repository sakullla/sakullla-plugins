schema_version: 1
id: ip-policy
version: 0.1.0
name: IP Policy
description: Authenticated HTTP and L4 IPv4/IPv6 and host-managed GeoIP policy
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: wasm-policy
  abi: nre:policy/v1
  host_scope: agent
  entry: artifacts/ip-policy.wasm
  policy_kind: ip
artifacts:
  - path: artifacts/ip-policy.wasm
    sha256: 05baa9c64b81023d2fb9acb41edf1254e2d71cec58eabdb0564b38da0b6b3047
    size: 9096
    mode: wasm
extension_points:
  - http.request
  - l4.accept
permissions:
  - name: policy.read
  - name: event.emit
  - name: policy.trusted-source
config_schema: config.schema.json
ui_schema: ui.schema.json
resource_budget:
  timeout_ms: 2
  memory_bytes: 16777216
  concurrency: 64
  input_bytes: 131072
  output_bytes: 4096
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: never
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
