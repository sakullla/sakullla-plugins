<!doctype html>
<html lang="zh-CN" data-theme="sakura-day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cloudflare 域名 Token 映射</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wash" aria-hidden="true"></div>
  <main>
    <header class="page-head">
      <p class="kicker">Cloudflare DNS</p>
      <h1>域名 Token 映射</h1>
      <p class="lede">按域名后缀绑定 Cloudflare DNS Token。列表、详情和编辑框都不会回显 Token。本页不配置区域 Token，也不管理 DNS 记录。</p>
    </header>
    <p id="mapping-loading" role="status">正在加载映射...</p>
    <p id="mapping-unavailable" role="status" hidden>插件页面已加载；宿主资源能力尚不可用，Token 与 DNS 操作保持关闭。</p>
    <p id="mapping-denied" role="alert" hidden>无权访问 Cloudflare 域名 Token 映射，请求已被明确拒绝。</p>
    <div id="mapping-workspace" hidden>
      <section class="panel" id="mapping-create" aria-labelledby="mapping-create-title" hidden>
        <h2 id="mapping-create-title">新增映射</h2>
        <form id="create-form" method="post" data-action="create">
          <label>域名后缀 <input name="suffix" required autocomplete="off" placeholder="example.com" spellcheck="false"></label>
          <label>Cloudflare DNS Token <input name="token" type="password" autocomplete="new-password" required></label>
          <button type="submit" class="btn-primary">添加映射</button>
        </form>
        <p class="hint">后缀按最长匹配生效。Token 只在提交时发送。</p>
      </section>
      <section class="panel" aria-labelledby="mapping-list-title">
        <div class="section-head">
          <h2 id="mapping-list-title">已保存映射</h2>
          <p id="mapping-count" class="count" hidden></p>
        </div>
        <div id="mapping-list"></div>
        <p id="mapping-empty" hidden>还没有映射。</p>
      </section>
      <p id="mapping-status" role="status" hidden></p>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
