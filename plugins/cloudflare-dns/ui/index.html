<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cloudflare 域名 Token 映射</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <h1>Cloudflare 域名 Token 映射</h1>
  </header>
  <main>
    <p id="mapping-loading" role="status">正在加载映射...</p>
    <p id="mapping-unavailable" role="status" hidden>插件页面已加载；宿主资源能力尚不可用，Token 与 DNS 操作保持关闭。</p>
    <p id="mapping-denied" role="alert" hidden>无权访问 Cloudflare 域名 Token 映射，请求已被明确拒绝。</p>
    <div id="mapping-workspace" hidden>
    <p class="lede">按域名后缀绑定 Cloudflare DNS Token。保存后列表、详情和编辑框都不会回显 Token。本页不配置区域 Token，也不管理 DNS 记录。</p>
    <section class="card" aria-labelledby="mapping-list-title">
      <h2 id="mapping-list-title">已保存映射</h2>
      <div id="mapping-list">
        <table id="mapping-table" hidden>
          <thead>
            <tr>
              <th>域名后缀</th>
              <th>已配置</th>
              <th>最近更新</th>
              <th id="mapping-actions-heading">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr id="mapping-row-template" hidden>
              <td data-field="suffix"></td>
              <td data-field="configured"></td>
              <td data-field="updated"></td>
              <td class="actions" data-field="actions"></td>
            </tr>
          </tbody>
        </table>
        <p id="mapping-empty" hidden>还没有映射。</p>
      </div>
    </section>
    <section class="card" id="mapping-create" aria-labelledby="mapping-create-title" hidden>
      <h2 id="mapping-create-title">新增映射</h2>
      <form id="create-form" method="post" data-action="create">
        <label>域名后缀 <input name="suffix" required autocomplete="off"></label>
        <label>Cloudflare DNS Token <input name="token" type="password" autocomplete="new-password" required></label>
        <button type="submit">保存</button>
      </form>
    </section>
    <p id="mapping-status" role="status" hidden></p>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
