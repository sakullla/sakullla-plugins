schema_version: 1
id: cloudflare-dns
version: 0.1.3
name: Cloudflare DNS
description: 按域名后缀解析 Cloudflare DNS Token，并提供专门映射管理页
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: control-plane
  entry: cloudflare-dns
artifacts:
  - path: artifacts/linux-amd64/cloudflare-dns
    sha256: 65a3f2f4a042a5a345e5c58bf4654503261c2eb41a716bfa74f0916aa8350da1
    size: 8611800
    mode: executable
    goos: linux
    goarch: amd64
extension_points:
  - dns.provider
  - ui.route
  - resource.group
ui_route_id: cloudflare-dns
resource_group_id: cloudflare-dns
metadata:
  ui.nav.group: 基础设施
  ui.nav.label: 域名 Token
  resource.group.ref: resource-group/cloudflare-dns
  resource.group.label: Cloudflare DNS
  resource.group.description: 按域名后缀隔离 Token 映射
permissions:
  - name: dns.manage
  - name: secret.use
  - name: event.emit
  - name: service.revocable-resource-handle
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
