schema_version: 1
id: accelerator-sources
version: 0.1.14
name: 资源加速
description: 为零配置发布的自有域名提供 Docker、GitHub 与 Hugging Face 加速
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: agent
  entry: accelerator-sources
artifacts:
  - path: artifacts/linux-amd64/accelerator-sources
    sha256: ae3e6f2cb8ff0f2b6ad94c9dbd5bfbc06b98dcc4eacd710ec1758b09588b201e
    size: 21509599
    mode: executable
    goos: linux
    goarch: amd64
extension_points:
  - http.backend-provider
http_backend_providers:
  - id: default
    display_name: 资源加速
permissions:
  - name: http.outbound
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
