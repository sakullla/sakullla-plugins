schema_version: 1
id: accelerator-sources
version: 0.1.0
name: Accelerator Sources
description: Brokered Docker and GitHub accelerator source control plane
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: control-plane
  entry: accelerator-sources
artifacts:
  - path: artifacts/linux-amd64/accelerator-sources
    sha256: 4e470d1a8ad3938997c4db79b0cc82882a07c4bf4a5b39827a1e3fc38fe2c93a
    size: 8618950
    mode: executable
    goos: linux
    goarch: amd64
extension_points:
  - container.provider
permissions:
  - name: agent.read
  - name: agent.configure
  - name: container.read
  - name: container.manage
  - name: event.emit
  - name: service.revocable-resource-handle
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
