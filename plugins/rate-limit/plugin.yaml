schema_version: 1
id: rate-limit
version: 0.1.0
name: Rate Limit
description: Node-local bounded GCRA admission for HTTP sources, HTTP rules, and new L4 flows
compatibility:
  host: ">=0.1.0"
  agent: ">=0.1.0"
runtime:
  kind: wasm-policy
  abi: nre:policy/v1
  host_scope: agent
  entry: artifacts/rate-limit.wasm
artifacts:
  - path: artifacts/rate-limit.wasm
    sha256: d2263ece45973d92f01395aa08731b60b944d57e66f566c6dae0f64c254763c6
    size: 9364
    mode: wasm
extension_points:
  - http.request
  - l4.accept
permissions:
  - policy.read
  - event.emit
config_schema: config.schema.json
ui_schema: ui.schema.json
resource_budget:
  timeout_ms: 2
  memory_bytes: 16777216
  concurrency: 64
  input_bytes: 131072
  output_bytes: 4096
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: never
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: package.sig
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
metadata:
  capability.policy.monotonic-clock: available
  capability.policy.atomic-state: available
  counter_scope: single-agent-local
  quota_boundary: not-user-resource-bandwidth-or-traffic-quota
