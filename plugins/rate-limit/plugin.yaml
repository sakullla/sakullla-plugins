schema_version: 1
id: rate-limit
version: 0.1.0
name: 速率限制
description: 限制本节点 HTTP 来源、规则和新建四层连接的速率
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: wasm-policy
  abi: nre:policy/v1
  host_scope: agent
  entry: artifacts/rate-limit.wasm
  policy_kind: rate
artifacts:
  - path: artifacts/rate-limit.wasm
    sha256: 92eb3d35b16dbbff8e98d72bb2c27f24dcef95b135d8d8a60718135496ba2f48
    size: 9117
    mode: wasm
extension_points:
  - http.request
  - l4.accept
permissions:
  - name: policy.read
  - name: event.emit
  - name: policy.atomic-state
  - name: policy.monotonic-clock
config_schema: config.schema.json
ui_schema: ui.schema.json
resource_budget:
  timeout_ms: 2
  memory_bytes: 16777216
  concurrency: 64
  input_bytes: 131072
  output_bytes: 4096
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: never
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
