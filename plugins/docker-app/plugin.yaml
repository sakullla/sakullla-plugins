schema_version: 1
id: docker-app
version: 0.1.0
name: Docker 应用
description: 通过面板管理 Docker 与 Compose 应用的发布和访问
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: agent
  entry: docker-app
artifacts:
  - path: artifacts/linux-amd64/docker-app
    sha256: 8ebe9b89d285dc4a3ec6cb994265338d07dcb2679c7477c519c75e108b971675
    size: 8343588
    mode: executable
    goos: linux
    goarch: amd64
extension_points:
  - container.provider
  - http.backend-provider
http_backend_providers:
  - id: default
    display_name: Docker 应用
permissions:
  - name: container.compose
  - name: http.rule
  - name: ui.dynamic
  - name: event.emit
  - name: service.revocable-resource-handle
  - name: http.outbound
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
