{
  "schema_version": 1,
  "id": "docker-app",
  "version": "0.1.0",
  "name": "Docker App",
  "description": "Brokered Docker and Compose application lifecycle with core-owned HTTP rules",
  "compatibility": {"host": ">=0.1.0", "agent": ">=0.1.0"},
  "runtime": {"kind": "rpc-service", "abi": "nre:rpc/v1", "host_scope": "agent", "entry": "artifacts/docker-app"},
  "permissions": ["docker-compose", "http-rule", "dynamic-ui"],
  "config_schema": "config.schema.json",
  "failure_policy": {"on_error": "fail-closed", "restart": "bounded-backoff"},
  "cleanup": {"instances": "delete-owned", "shared_refs": "retain", "core_rules": "release"},
  "metadata": {"capability.typed-docker-handles": "unavailable"}
}
