schema_version: 1
id: docker-app
version: 0.1.13
name: Docker 应用
description: 通过 compose YAML 管理 Agent 上的应用启停、日志与删除
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: control-plane
  host_scopes:
    - agent
  entry: docker-app
artifacts:
  - path: artifacts/linux-amd64/docker-app
    sha256: 8ebe9b89d285dc4a3ec6cb994265338d07dcb2679c7477c519c75e108b971675
    size: 8343588
    mode: executable
    goos: linux
    goarch: amd64
extension_points:
  - ui.route
  - resource.group
ui_route_id: docker-app
resource_group_id: docker-app
metadata:
  ui.nav.group: 基础设施
  ui.nav.label: Docker 应用
  resource.group.ref: resource-group/docker-app
  resource.group.label: Docker 应用
  resource.group.description: 在组内管理 compose 应用与 HTTP 入口
assets:
  - assets/ui/index.html
  - assets/ui/app.js
  - assets/ui/style.css
permissions:
  - name: http.rule
  - name: ui.dynamic
  - name: event.emit
  - name: service.revocable-resource-handle
    resource: docker-compose:managed
  - name: http.outbound
  - name: storage.read
  - name: storage.write
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
