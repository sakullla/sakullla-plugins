schema_version: 1
id: shadowsocks-server
version: 0.1.13
name: Shadowsocks 服务
description: 通过简单面板管理账号，并分享本机自监听的 Shadowsocks 服务
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: control-plane
  host_scopes:
    - agent
  entry: shadowsocks-server
artifacts:
  - path: artifacts/linux-amd64/shadowsocks-server
    sha256: e2cec116f5bf1c482e22233be41a4ecbc59149f338e702bf06bbd45b4c647ced
    size: 8791112
    mode: executable
    goos: linux
    goarch: amd64
extension_points:
  - ui.route
  - resource.group
ui_route_id: shadowsocks-server
resource_group_id: shadowsocks-server
metadata:
  ui.nav.group: 网络
  ui.nav.label: Shadowsocks 账号
  resource.group.ref: resource-group/shadowsocks-server
  resource.group.label: Shadowsocks 服务
  resource.group.description: 在组内按节点管理 Shadowsocks 监听与账号
assets:
  - assets/ui/index.html
  - assets/ui/app.js
  - assets/ui/style.css
permissions:
  - name: secret.use
  - name: storage.read
  - name: storage.write
  - name: event.emit
  - name: service.revocable-resource-handle
  - name: network.full
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
