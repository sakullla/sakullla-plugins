<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shadowsocks 账号</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <h1>Shadowsocks 账号</h1>
  </header>
  <main>
    <p class="lede">在本页生成、列出、停用、再启用、轮换并分享账号。客户端用 SIP002 URI 或二维码导入后，直接连接本节点自监听的 TCP/UDP 端口，不必先建 L4 规则，也无需打开 L4 规则页。</p>
    <section class="card" id="listen-card" aria-labelledby="listen-title">
      <h2 id="listen-title">对外监听</h2>
      <p id="listen-status">正在读取本节点对外主机与端口…</p>
      <p class="hostport-row" hidden>
        <code id="listen-hostport"></code>
        <button type="button" id="copy-hostport" hidden>复制 host:port</button>
      </p>
      <p class="hint">此地址按节点 DDNS、否则 IPv4、再否则 IPv6 选出，端口为本实例实际监听端口，可直接填进现有 L4 后端。</p>
    </section>
    <section class="card" id="create-card" aria-labelledby="create-title">
      <h2 id="create-title">生成账号</h2>
      <p>不必编辑原始配置，也不必填写配额或过期时间。</p>
      <div class="actions">
        <form id="create-ss" method="post" data-action="create" data-family="ss">
          <button type="submit">生成传统 SS 账号</button>
        </form>
        <form id="create-ss2022" method="post" data-action="create" data-family="ss2022">
          <button type="submit">生成 SS2022 账号</button>
        </form>
      </div>
    </section>
    <section class="card" id="account-card" aria-labelledby="account-title">
      <h2 id="account-title">账号列表</h2>
      <p id="account-empty">还没有账号。</p>
      <div id="account-list"></div>
      <form id="rotate-server-psk" method="post" data-action="rotate-server" hidden>
        <button type="submit">轮换 SS2022 服务端 PSK</button>
      </form>
    </section>
    <p id="panel-status" role="status" hidden></p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
