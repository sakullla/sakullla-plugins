<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文件共享</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wash" aria-hidden="true"></div>
  <main>
    <section id="login-view" class="login-stage">
      <div class="login-panel">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true"></span>
          <p class="brand">文件共享</p>
        </div>
        <h1>打开你的个人目录</h1>
        <ul class="facts">
          <li>用户名可自定，不必注册</li>
          <li>每个名字隔离一份目录</li>
          <li>口令是部署时的共享口令</li>
        </ul>
        <form id="login-form">
          <div class="field">
            <label for="login-username">用户名</label>
            <input id="login-username" name="username" type="text" autocomplete="username" spellcheck="false" required placeholder="自己起一个名字">
          </div>
          <div class="field">
            <label for="login-password">共享口令</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p id="login-error" role="alert" hidden></p>
          <div class="dialog-actions">
            <button type="submit">进入目录</button>
          </div>
        </form>
      </div>
    </section>
    <div id="manager-view" hidden>
      <header class="topbar">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true"></span>
          <p class="brand">文件共享</p>
        </div>
        <div class="topbar-meta">
          <p class="who">
            <span class="who-chip">
              <span class="who-initial" id="who-initial" aria-hidden="true"></span>
              当前用户 <code id="current-username"></code>
            </span>
          </p>
          <button type="button" id="logout-button" class="ghost">退出</button>
        </div>
      </header>
      <section class="card files-card">
        <div class="files-head">
          <div>
            <p class="kicker">当前目录</p>
            <nav id="crumbs" class="crumbs" aria-label="路径"></nav>
          </div>
          <div class="actions">
            <label class="upload">
              上传
              <input id="upload-input" type="file">
            </label>
            <button type="button" id="mkdir-button" class="ghost">新建目录</button>
          </div>
        </div>
        <p id="status" role="status" hidden></p>
        <table class="listing">
          <thead>
            <tr>
              <th>名称</th>
              <th>类型</th>
              <th>大小</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="listing"></tbody>
        </table>
        <p id="empty" class="hint" hidden>这个目录是空的。</p>
      </section>
      <section class="card mount-card">
        <div class="mount-copy">
          <p class="kicker">WebDAV</p>
          <h2>映射到系统或 rclone</h2>
          <p>HTTP Basic 的用户名会选择独立目录，口令为共享口令；同一口令作 Bearer 时进入共享根。</p>
        </div>
        <p class="host-line"><span class="host-dot" aria-hidden="true"></span>挂载地址<code id="dav-url">/dav/</code></p>
      </section>
    </div>
  </main>
  <dialog id="mkdir-dialog" aria-labelledby="mkdir-title">
    <form id="mkdir-form">
      <h2 id="mkdir-title">新建目录</h2>
      <label for="mkdir-name">目录名称</label>
      <input id="mkdir-name" type="text" name="name" autocomplete="off" spellcheck="false">
      <p id="mkdir-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="submit">确定</button>
        <button type="button" class="ghost" id="mkdir-cancel">取消</button>
      </div>
    </form>
  </dialog>
  <script src="/static/app.js" defer></script>
</body>
</html>
