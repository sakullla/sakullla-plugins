<!doctype html>
<html lang="zh-CN" data-theme="sakura-day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>文件共享</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wash" aria-hidden="true"></div>
  <header class="masthead">
    <div class="masthead-inner">
      <span class="wordmark">文件共享</span>
    </div>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">网页 · WebDAV</p>
      <h1>同一入口管理这份共享</h1>
      <p class="lede">浏览、下载、上传、新建目录、重命名和删除都使用部署时配置的共享口令。WebDAV 客户端挂载同一地址即可读写同一共享根。</p>
    </section>
    <section class="card mount-card">
      <p class="kicker">挂载说明</p>
      <h2>当前入口的 WebDAV</h2>
      <p>把下面的地址填入系统映射网络驱动器、rclone 或同类客户端。认证方式为 HTTP Basic，用户名 <code>webdav</code>，口令为共享口令。</p>
      <p class="host-line"><span class="host-dot" aria-hidden="true"></span>挂载地址<code id="dav-url">/dav/</code></p>
      <p class="hint">地址由当前页面的 <code>window.location.origin</code> 加上 <code>/dav/</code> 生成，不必猜测插件内部地址。</p>
    </section>
    <section class="card files-card">
      <div class="files-head">
        <div>
          <p class="kicker">文件</p>
          <h2>当前目录</h2>
          <nav id="crumbs" class="crumbs" aria-label="路径"></nav>
        </div>
        <div class="actions">
          <label class="upload">
            上传
            <input id="upload-input" type="file">
          </label>
          <button type="button" id="mkdir-button">新建目录</button>
        </div>
      </div>
      <p id="status" role="status" hidden></p>
      <table class="listing">
        <thead>
          <tr>
            <th>名称</th>
            <th>类型</th>
            <th>大小</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="listing"></tbody>
      </table>
      <p id="empty" class="hint" hidden>这个目录是空的。</p>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
