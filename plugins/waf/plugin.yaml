schema_version: 1
id: waf
version: 0.1.0
name: Sakullla WAF
description: Deterministic bounded HTTP request inspection with managed and custom rules
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: wasm-policy
  abi: nre:policy/v1
  host_scope: agent
  entry: artifacts/waf.wasm
  policy_kind: waf
artifacts:
  - path: artifacts/waf.wasm
    sha256: 4e2deabbae13572a39f6f28b8307e1a07b02c1a8ef393be919770ed37fed511a
    size: 169215
    mode: wasm
extension_points:
  - http.request
permissions:
  - name: http.inspect
  - name: http.respond
  - name: event.emit
  - name: policy.trusted-source
config_schema: config.schema.json
resource_budget:
  timeout_ms: 2
  memory_bytes: 16777216
  concurrency: 64
  input_bytes: 131072
  output_bytes: 4096
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: never
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
