schema_version: 1
id: waf
version: 0.1.1
name: Web 防火墙
description: 用专用管理页查看 HTTP 入口防护、切换观察拦截，并检查托管规则与有界自定义规则
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: control-plane
  entry: waf
  policy_kind: waf
  policy:
    kind: wasm-policy
    abi: nre:policy/v1
    host_scope: agent
    entry: artifacts/waf.wasm
    resource_budget:
      timeout_ms: 2
      memory_bytes: 16777216
      concurrency: 64
      input_bytes: 131072
      output_bytes: 4096
    failure_policy:
      on_error: fail-closed
      on_budget: fail-closed
      restart: never
      core_fallback: preserve
artifacts:
  - path: artifacts/linux-amd64/waf
    sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    size: 1
    mode: executable
    goos: linux
    goarch: amd64
  - path: artifacts/waf.wasm
    sha256: 4e2deabbae13572a39f6f28b8307e1a07b02c1a8ef393be919770ed37fed511a
    size: 169215
    mode: wasm
extension_points:
  - ui.route
  - http.request
ui_route_id: waf
metadata:
  ui.nav.group: 安全
  ui.nav.label: Web 防火墙
assets:
  - assets/ui/index.html
  - assets/ui/app.js
  - assets/ui/style.css
permissions:
  - name: http.rule
  - name: ui.dynamic
  - name: event.emit
  - name: storage.read
  - name: storage.write
  - name: http.inspect
  - name: http.respond
  - name: policy.trusted-source
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
