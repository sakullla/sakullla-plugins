schema_version: 1
id: reverse-l4
version: 0.1.0
name: 四层反代
description: 把 TCP 与 UDP 流量反代到后端服务
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: agent
  entry: reverse-l4
artifacts:
  - path: artifacts/linux-amd64/reverse-l4
    sha256: d54a0a912a155c0cfa59af56c930b8e8b2ec93f5a6806364db44f9e8a49212d8
    size: 8336537
    mode: executable
    goos: linux
    goarch: amd64
extension_points:
  - l4.accept
  - tunnel.provider
permissions:
  - name: l4.inspect
  - name: l4.respond
  - name: event.emit
  - name: service.revocable-resource-handle
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
