schema_version: 1
id: reverse-l4
version: 0.3.7
name: 四层反向穿透
description: 把内网 TCP/UDP 服务经入口 L4 规则与出口反向通道发布到公网入口
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: control-plane
  entry: reverse-l4
artifacts:
  - path: artifacts/linux-amd64/reverse-l4
    sha256: 46c7af01daad8868660d451ddb63ff95ab9b183d85b4a2d4794df11a69ed60cc
    size: 20254129
    mode: executable
    goos: linux
    goarch: amd64
extension_points:
  - ui.route
  - resource.group
ui_route_id: reverse-l4
resource_group_id: reverse-l4
metadata:
  ui.nav.group: 网络
  ui.nav.label: 四层反向穿透
  resource.group.ref: resource-group/reverse-l4
  resource.group.label: 四层反向穿透
  resource.group.description: 管理反向穿透映射、入口 L4 规则与通道状态
assets:
  - assets/ui/index.html
  - assets/ui/app.js
  - assets/ui/style.css
permissions:
  - name: l4.rule
  - name: channel.reverse
  - name: storage.read
  - name: storage.write
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
