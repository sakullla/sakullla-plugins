schema_version: 1
id: doh
version: 0.2.0
name: HTTPS 域名解析
description: 为零配置发布的自有域名提供 DNS over HTTPS 解析
compatibility:
  host: "*"
  agent: "*"
runtime:
  kind: rpc-service
  abi: nre:rpc/v1
  host_scope: agent
  entry: doh
artifacts:
  - path: artifacts/linux-amd64/doh
    sha256: 08ea6d1c744d92207b8c2b09aa9e4ce76511c4fc0f17d1d8c844293db7e45a6f
    size: 8587776
    mode: executable
    goos: linux
    goarch: amd64
extension_points:
  - http.backend-provider
http_backend_providers:
  - id: default
    display_name: HTTPS 域名解析
permissions:
  - name: http.outbound
config_schema: config.schema.json
resource_budget:
  timeout_ms: 30000
  memory_bytes: 268435456
  concurrency: 8
  input_bytes: 1048576
  output_bytes: 1048576
  cpu_millis: 1000
  restarts: 3
failure_policy:
  on_error: fail-closed
  on_budget: fail-closed
  restart: on-failure
  core_fallback: preserve
signature:
  algorithm: ed25519
  key_id: sakullla-official-root-2026
  file: signature.json
cleanup:
  instances: delete
  config: delete
  owned_data: delete
  grants: delete
  shared_refs: retain
  audit_events: retain
